<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="Thư viện video YouTube cá nhân, phát clip trực tiếp từ danh sách Google Sheets.">
<meta property="og:title" content="Clip Library">
<meta property="og:description" content="Thư viện video YouTube cá nhân.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23111111%27/%3E%3Cpath d=%27M38 25 L75 50 L38 75 Z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E">
<title>Clip Library</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--muted:#929292;--text:#f5f5f5;--accent:#e11d48}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:#0b0b0b}
.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#222;color:#fff;font-size:18px}
.brand{font-weight:800;letter-spacing:.11em;font-size:15px}
.tagline{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.14em}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(280px,3fr)}
.player-pane{min-width:0;min-height:0;display:flex;flex-direction:column;padding:20px 22px;gap:14px;border-right:1px solid var(--line)}
.player-heading{display:flex;align-items:center;gap:8px;color:#bcbcbc;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.dot{width:7px;height:7px;background:#e11d48;border-radius:50%}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100% - 80px);margin:0;background:#000;border:1px solid #222;border-radius:12px;overflow:hidden;flex:0 0 auto}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#777;text-align:center;padding:20px}
.empty .play-icon{font-size:44px;color:#eee}
.now-title{font-size:clamp(16px,2vw,23px);font-weight:700;line-height:1.35;margin:0}
.now-meta{font-size:12px;color:var(--muted)}
.list-pane{display:flex;flex-direction:column;min-height:0;background:#0c0c0c}
.list-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.list-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list-title{font-size:16px;font-weight:750;margin:0}
.count{font-size:11px;color:#ccc;background:#242424;padding:5px 8px;border-radius:99px}
.search{margin-top:14px;width:100%;border:1px solid #303030;background:#151515;color:#fff;padding:11px 12px;border-radius:8px;font:inherit;font-size:13px;outline:none}
.search:focus{border-color:#666}
.clip-list{padding:8px;overflow:auto;min-height:0;flex:1}
.clip{width:100%;display:flex;align-items:center;gap:11px;padding:10px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;color:inherit;cursor:pointer}
.clip:hover{background:#191919}
.clip.active{background:#211216;border-color:#4b202b}
.thumb{width:74px;flex:0 0 74px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#252525;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-shadow:0 1px 6px #000;font-size:15px}
.clip-info{min-width:0;flex:1}
.clip-name{font-size:13px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clip-sub{margin-top:5px;font-size:10px;color:var(--muted)}
.empty-list{padding:28px 16px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
.status{padding:9px 18px;border-top:1px solid var(--line);font-size:10px;color:#777}
@media(max-width:700px){
 body{overflow:hidden}
 .topbar{height:48px;flex-basis:48px;padding:0 14px}
 .logo{width:29px;height:29px}.brand{font-size:13px}.tagline{font-size:9px}
 .main{display:flex;flex-direction:column}
 .player-pane{flex:0 0 30%;min-height:0;padding:10px 12px;gap:7px;border-right:0;border-bottom:1px solid var(--line)}
 .player-heading{font-size:9px}
 .video-wrap{width:100%;height:auto;max-height:none;aspect-ratio:16/9;margin:0;flex:0 0 auto}
 .now-title{font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
 .now-meta{font-size:10px}
 .list-pane{flex:1;min-height:0}
 .list-head{padding:12px 12px 9px}
 .list-title{font-size:14px}.search{margin-top:9px;padding:9px 10px;font-size:12px}
 .clip-list{padding:5px}
 .clip{padding:8px;gap:9px}
 .thumb{width:67px;flex-basis:67px}
 .clip-name{font-size:12px}
 .status{padding:7px 12px}
}
@media(max-width:380px){
 .player-pane{padding:8px}
 .video-wrap{aspect-ratio:16/9}
 .thumb{width:58px;flex-basis:58px}
 .clip-name{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">▶</div><div class="brand">CLIP LIBRARY</div>
    <div class="tagline">VIDEO COLLECTION</div>
  </header>
  <main class="main">
    <section class="player-pane">
      <div class="player-heading"><span class="dot"></span><span>Now playing</span></div>
      <div class="video-wrap" id="videoWrap">
        <div class="empty" id="emptyState"><div class="play-icon">▷</div><div>Chọn một clip trong danh sách để bắt đầu</div></div>
      </div>
      <h1 class="now-title" id="nowTitle">Chưa chọn clip</h1>
      <div class="now-meta" id="nowMeta">Danh sách được tải từ Google Sheets</div>
    </section>
    <aside class="list-pane">
      <div class="list-head">
        <div class="list-title-row"><h2 class="list-title">Danh sách clip</h2><span class="count" id="clipCount">0 clips</span></div>
        <input class="search" id="search" type="search" placeholder="Tìm tên clip..." aria-label="Tìm tên clip">
      </div>
      <div class="clip-list" id="clipList"><div class="empty-list">Đang tải danh sách clip…</div></div>
      <div class="status" id="status" role="status" aria-live="polite">Đang kết nối dữ liệu</div>
    </aside>
  </main>
</div>
<script>
/*
  CẤU HÌNH:
  1) Xuất bản Google Sheet thành CSV (File > Share > Publish to web > CSV).
  2) Dán URL CSV vào SHEET_CSV_URL phía dưới.
  Sheet có hàng tiêu đề: URL | Name.
*/
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS6pSicLqddMTpqdhfKN_PZbPJ7awj6R-dKf2lms3w3bwS0klU8hEwdWGW93H-8oS558MrE2cwY588h/pub?output=csv"; // Dán URL CSV đã Publish to web vào đây.

let clips = [];
let activeIndex = -1;

function parseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(c==='"' && quoted && next==='"'){cell+='"';i++;}
    else if(c==='"'){quoted=!quoted;}
    else if(c===',' && !quoted){row.push(cell);cell="";}
    else if((c==='\n'||c==='\r')&&!quoted){
      if(c==='\r'&&next==='\n')i++;
      row.push(cell); if(row.some(v=>v.trim()!==""))rows.push(row);
      row=[];cell="";
    } else cell+=c;
  }
  if(cell.length||row.length){row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row);}
  if(!rows.length)return [];
  const headers=rows.shift().map(v=>v.replace(/^\uFEFF/, "").trim().toLowerCase());
  const urlIndex=headers.indexOf("url"), nameIndex=headers.indexOf("name");
  if(urlIndex<0||nameIndex<0)throw new Error('Không tìm thấy hai cột có tiêu đề "URL" và "Name".');
  return rows.map(r=>({URL:(r[urlIndex]||"").trim(),Name:(r[nameIndex]||"").trim()}))
    .filter(v=>v.URL&&v.Name);
}
function getVideoId(raw){
  try{
    const u=new URL(raw);
    if(u.hostname==="youtu.be")return u.pathname.split("/").filter(Boolean)[0]||null;
    if(u.hostname==="youtube.com"||u.hostname==="www.youtube.com"||u.hostname==="m.youtube.com"||u.hostname==="music.youtube.com"){
      if(u.pathname==="/watch")return u.searchParams.get("v");
      const parts=u.pathname.split("/").filter(Boolean);
      if(["embed","shorts","live"].includes(parts[0]))return parts[1]||null;
    }
  }catch(e){}
  return null;
}
function safeText(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderList(filter=""){
  const list=document.getElementById("clipList");
  const needle=filter.trim().toLocaleLowerCase();
  const filtered=clips.map((clip,index)=>({...clip,index})).filter(c=>c.Name.toLocaleLowerCase().includes(needle));
  document.getElementById("clipCount").textContent=clips.length+" clips";
  if(!filtered.length){list.innerHTML='<div class="empty-list">Không tìm thấy clip phù hợp.</div>';return;}
  list.innerHTML="";
  filtered.forEach(clip=>{
    const id=getVideoId(clip.URL);
    const button=document.createElement("button");
    button.type="button";button.className="clip"+(clip.index===activeIndex?" active":"");
    const thumb=id?`https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`:"";
    button.innerHTML=`<div class="thumb">${thumb?`<img loading="lazy" alt="" src="${thumb}">`:""}</div><div class="clip-info"><div class="clip-name">${safeText(clip.Name)}</div><div class="clip-sub">YouTube · Clip ${String(clip.index+1).padStart(2,"0")}</div></div>`;
    button.addEventListener("click",()=>playClip(clip.index));
    list.appendChild(button);
  });
}
function playClip(index){
  const clip=clips[index];if(!clip)return;
  const id=getVideoId(clip.URL);
  if(!id){document.getElementById("status").textContent="URL không phải liên kết YouTube hợp lệ.";return;}
  activeIndex=index;
  const wrap=document.getElementById("videoWrap");
  wrap.innerHTML="";
  const iframe=document.createElement("iframe");
  iframe.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0";
  iframe.title=clip.Name;iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allowFullscreen=true;
  wrap.appendChild(iframe);
  document.getElementById("nowTitle").textContent=clip.Name;
  document.getElementById("nowMeta").textContent="Clip "+(index+1)+" / "+clips.length+" · YouTube";
  document.getElementById("status").textContent="Đã chọn: "+clip.Name;
  renderList(document.getElementById("search").value);
}
async function loadClips(){
  const status=document.getElementById("status");
  const list=document.getElementById("clipList");
  if(!SHEET_CSV_URL.trim()){
    clips=DEMO_CLIPS;renderList();
    status.textContent="Chưa kết nối Google Sheets. Hãy điền SHEET_CSV_URL trong index.html rồi tải lại website.";
    return;
  }
  let parsedUrl;
  try{ parsedUrl=new URL(SHEET_CSV_URL); }
  catch(e){
    clips=DEMO_CLIPS;renderList();
    status.textContent="URL Google Sheets không hợp lệ. Kiểm tra cấu hình SHEET_CSV_URL.";
    return;
  }
  if(parsedUrl.protocol!=="https:"){
    clips=DEMO_CLIPS;renderList();
    status.textContent="URL CSV phải bắt đầu bằng https://";
    return;
  }
  list.innerHTML='<div class="empty-list">Đang tải dữ liệu từ Google Sheets…</div>';
  try{
    const response=await fetch(SHEET_CSV_URL,{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const csvText=await response.text();
    const loaded=parseCSV(csvText);
    if(!loaded.length)throw new Error('Không tìm thấy dữ liệu hợp lệ. Kiểm tra tiêu đề URL, Name và trạng thái Publish to web.');
    clips=loaded;renderList();
    status.textContent="Đã tải "+clips.length+" clip từ Google Sheets.";
  }catch(error){
    clips=DEMO_CLIPS;renderList();
    status.textContent="Không tải được Sheet. Hãy kiểm tra URL CSV đã Publish to web và quyền truy cập. Chi tiết: "+error.message;
  }
}
document.getElementById("search").addEventListener("input",e=>renderList(e.target.value));
loadClips();
</script>
</body>
</html>
